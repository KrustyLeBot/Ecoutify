name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Erreurs de compilation
        if: failure()
        run: grep -E '^e: |error:|What went wrong|Execution failed|> ' -A2 build.log | head -80 || true
      - uses: actions/upload-artifact@v4
        with:
          name: ecoutify-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
