name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|Execution failed' -A3 build.log | head -80 || true
      # Kept as a fallback (a zip, 7 days) in case publishing the release fails.
      - uses: actions/upload-artifact@v4
        with:
          name: ecoutify-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      # The single "latest" release always holds the newest successful build, as a plain .apk.
      # The app reads it to offer updates; its name ends with the build number (= the version code).
      - name: Publish the APK to the "latest" release
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ecoutify.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ecoutify.apk \
            --title "Ecoutify build ${{ github.run_number }}" \
            --notes "Debug build ${{ github.run_number }} of commit ${{ github.sha }}." \
            --target "${{ github.sha }}" \
            --latest
